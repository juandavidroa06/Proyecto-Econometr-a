# Ejecuta la batería de tests en cada push y pull request (no descarga datos:
# los tests usan los datos versionados y simulaciones).
name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Instalar dependencias (PyTorch en versión CPU)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Tests
        run: python -m pytest tests -q -p no:cacheprovider
